openapi: 3.1.0
info:
  description: '**Dinari API for enterprise usage.**


    Dinari''s dShares let businesses offer tokenized access to stocks to their customers through an easy-to-use API.

    Integrate Dinari''s API and offer over a hundred stocks and ETFs to your customers.

    '
  contact:
    email: hello@dinari.com
  license:
    name: Contact us
  termsOfService: https://dinari.com/terms
  title: Dinari Enterprise Accounts Orders API
  version: v20260709-097f56a
servers:
- url: https://api-enterprise.sbt.dinari.com
tags:
- name: Orders
  description: '**`Orders` represent the buying and selling of assets under an `Account`.**


    For `Accounts` using self-custodied `Wallets`, `Orders` are created and fulfilled by making calls to Dinari''s smart contracts, or using the *Proxied Orders* methods.


    For `Accounts` using managed `Wallets`, `Orders` are created and fulfilled by using the `Managed Orders` methods, which then create the corresponding transactions on the blockchain.

    '
paths:
  /api/v2/orders/:
    get:
      parameters:
      - in: query
        name: chain_id
        description: CAIP-2 formatted chain ID of the blockchain the `Order` was made on.
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: order_transaction_hash
        description: Transaction hash of the `Order`.
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: order_fulfillment_transaction_hash
        description: Fulfillment transaction hash of the `Order`.
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: order_request_id
        description: Order Request ID for the `Order`
        schema:
          type:
          - string
          - 'null'
          format: uuid
        required: false
      - in: query
        name: limit
        description: Number of results to return
        schema:
          type: integer
          default: 20
          minimum: 20
          maximum: 100
        required: false
      - in: query
        name: order
        description: Sort order
        schema:
          default: asc
          type: string
          enum:
          - asc
          - desc
        required: false
      - in: query
        name: next
        description: Cursor for next page
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: previous
        description: Cursor for previous page
        schema:
          type:
          - string
          - 'null'
        required: false
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEntityOrderResponse'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      tags:
      - Orders
      summary: Get Orders for Entity
      description: Get a list of all `Orders` under the `Entity`.<br>Optionally `Orders` can be transaction hash or fulfillment transaction hash.
      operationId: getEntityOrders
      security:
      - ApiKeyId: []
        ApiSecretKey: []
  /api/v2/accounts/{account_id}/orders:
    parameters:
    - in: path
      name: account_id
      required: true
      schema:
        type: string
        format: uuid
    get:
      parameters:
      - in: query
        name: chain_id
        description: CAIP-2 formatted chain ID of the blockchain the `Order` was made on.
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: order_transaction_hash
        description: Transaction hash of the `Order`.
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: client_order_id
        description: Customer-supplied identifier to search for `Order`s.
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: limit
        description: Number of results to return
        schema:
          type: integer
          default: 20
          minimum: 20
          maximum: 100
        required: false
      - in: query
        name: order
        description: Sort order
        schema:
          default: asc
          type: string
          enum:
          - asc
          - desc
        required: false
      - in: query
        name: next
        description: Cursor for next page
        schema:
          type:
          - string
          - 'null'
        required: false
      - in: query
        name: previous
        description: Cursor for previous page
        schema:
          type:
          - string
          - 'null'
        required: false
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountOrderResponse'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      tags:
      - Orders
      summary: Get Orders
      description: Get a list of all `Orders` under the `Account`.<br>Optionally `Orders` can be filtered by chain ID, transaction hash, or client order ID.
      operationId: getOrders
      security:
      - ApiKeyId: []
        ApiSecretKey: []
  /api/v2/accounts/{account_id}/orders/{order_id}:
    parameters:
    - in: path
      name: account_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: order_id
      required: true
      schema:
        type: string
        format: uuid
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      tags:
      - Orders
      summary: Get Order by ID
      description: Get a specific `Order` by its ID.
      operationId: getOrderById
      security:
      - ApiKeyId: []
        ApiSecretKey: []
  /api/v2/accounts/{account_id}/orders/{order_id}/cancel:
    parameters:
    - in: path
      name: account_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: order_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      responses:
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseOpenApiError'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseOpenApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseOpenApiError'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      tags:
      - Orders
      summary: Cancel Order
      description: '

        Cancel an `Order` by its ID. Note that this requires the `Order` ID, not the `OrderRequest` ID.

        Once you submit a cancellation request, it cannot be undone. Be advised that orders with a

        status of PENDING_FILL, PENDING_ESCROW, FILLED, REJECTED, or CANCELLED cannot be cancelled.


        `Order` cancellation is not guaranteed nor is it immediate. The `Order` may still be executed

        if the cancellation request is not received in time.


        Check the status using the "Get Order by ID" endpoint to confirm whether the `Order` has been cancelled.

        '
      operationId: createOrderCancellation
      security:
      - ApiKeyId: []
        ApiSecretKey: []
  /api/v2/accounts/{account_id}/orders/cancel:
    parameters:
    - in: path
      name: account_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCancelOrderResponse'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCancelOrderInput'
      tags:
      - Orders
      summary: Cancel Orders
      description: '

        Cancel multiple `Orders` by their IDs in a single request. Note that this requires the `Order` IDs, not the `OrderRequest` IDs.

        Once you submit a cancellation request, it cannot be undone. Be advised that orders with a

        status of PENDING_FILL, PENDING_ESCROW, FILLED, REJECTED, or CANCELLED cannot be cancelled.


        `Order` cancellation is not guaranteed nor is it immediate. The `Orders` may still be executed

        if the cancellation request is not received in time.


        The response will indicate which orders were successfully queued to cancel and which failed to queue.

        Check the status using the "Get Order by ID" endpoint to confirm whether individual `Orders` have been cancelled.

        '
      operationId: createBatchOrderCancellation
      security:
      - ApiKeyId: []
        ApiSecretKey: []
  /api/v2/accounts/{account_id}/order_fulfillments:
