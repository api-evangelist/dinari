  "tags": [
    {
      "name": "Market Data",
      "description": "**Dinari provides basic market data for `Stocks` and `Alloys` that are available to transact on.**\n\nThis data is provided on a best-effort basis and we recommend using a dedicated provider for more intensive market data needs."
    },
    {
      "name": "Corporate Actions",
      "description": "**Corporate actions are events that affect the ownership of a `Stock`.**\n\nCorporate actions include dividends and stock splits.\n"
    },
    {
      "name": "Entities",
      "description": "**`Entities` represent a business or organization that uses the API, and their customers.**\n\nDinari Partners are represented as an organization `Entity` in the API, with their own accounts.\nIndividual customers of Partner `Entities` are also represented as `Entities` in the API, which are managed by the Partner `Entity`."
    },
    {
      "name": "KYC",
      "description": "**KYC (Know Your Customer) is a process of verifying the identity of customer `Entities`.**\n\nKYC is required for all customer `Entities` that transact on Dinari's platform.\n\nDinari provides a managed KYC process for its Partners, which provides a convenient KYC flow URL to present to the end customer.\n\nFor Dinari Partners that supply their own KYC data, the API provides a way to record a customer's KYC information using the Partner's KYC data. This requires an existing KYC agreement between Dinari and the Partner.\n"
    },
    {
      "name": "Accounts",
      "description": "**`Accounts` represent the financial accounts of an `Entity`.**\n\n`Orders`, dividends, and other transactions are associated with an `Account`."
    },
    {
      "name": "Wallets",
      "description": "**`Wallets` represent the blockchain wallet that holds the assets of an `Account`.**\n\nAn `Account` may be connected to a single `Wallet`.\n\nIndividual `Entities` can connect their self-custodied `Wallets` by proving ownership of the `Wallet` address.\nFor Dinari Partners, a Dinari-managed `Wallet` can be created for the Partner `Entity` in the [Dinari Partners Portal](https://Partners.dinari.com/). This may be used in omnibus accounting for self-managing customers' assets."
    },
    {
      "name": "Orders",
      "description": "**`Orders` represent the buying and selling of assets under an `Account`.**\n\nFor `Accounts` using self-custodied `Wallets`, `Orders` are created and fulfilled by making calls to Dinari's smart contracts, or using the *Proxied Orders* methods.\n\nFor `Accounts` using managed `Wallets`, `Orders` are created and fulfilled by using the `Managed Orders` methods, which then create the corresponding transactions on the blockchain.\n"
    },
    {
      "name": "Order Requests",
      "description": "**`Order Requests` represent requests for Dinari to create `Orders` on behalf of an `Account`.**\n\n`Order Requests` are created when placing **proxied orders** or **managed orders**. See their respective descriptions for more details.\n"
    },
    {
      "name": "Proxied Orders",
      "description": "**Proxied `Orders` represent the buying and selling of assets using a self-custodied `Wallet` in a gasless fashion.**\n\nFor `Accounts` using self-custodied `Wallets`, Dinari provides a way to create `Orders` that are proxied through Dinari's platform.\nThis allows the `Order` to be created and fulfilled without the need for the user to pay gas fees directly. The gas fees are instead paid with\nthe payment token the `Order` is placed with.\n\nPlacing a proxied `Order` involves two steps:\n\n1. Prepare a proxied order; this returns a set of [EIP-712](https://eips.ethereum.org/EIPS/eip-712) data to be signed by the `Wallet`.\n2. Submit the signed data to the *Create Proxied Order on EVM* route.\n\nThis creates an `OrderRequest` which is then submitted on chain by Dinari. Once the request is submitted on chain, the corresponding `Order` is created.\n\nNote that **fees are not included** in the `Order` amount. For buy orders, a fee will be added when placing the order.\nFor sell orders, the fee will be deducted from the proceeds of the sale.\n"
    },
    {
      "name": "Managed Orders",
      "description": "**Managed `Orders` represent the buying and selling of assets using a Dinari-managed `Wallet`.**\n\nSimilar to Proxied `Orders`, placing a managed `Order` creates an `OrderRequest` which is then submitted on chain by Dinari. Once the request is submitted on chain, the corresponding `Order` is created.\nUnlike Proxied `Orders`, managed `Orders` are available only for `Accounts` using Dinari-managed `Wallets`.\n\nNote that **fees are not included** in the `Order` amount. For buy orders, a fee will be added when placing the order. For sell orders, the fee will be deducted from the proceeds of the sale.\nCall the *Get Order Request Fee Quote* route for an estimate of the fee amount.\n"
    },
    {
      "name": "Withdrawals",
      "description": "**`Withdrawals` represent the transfer of stablecoins from an `Account` connected to a managed `Wallet` to another `Account` that is owned by the `Entity`.**\n\nSince the `Account` is backed by a managed `Wallet`, the `Withdrawal` must be processed by Dinari and the corresponding transaction is submitted on chain.\n\nUpon requesting a withdrawal, a `WithdrawalRequest` is created, which is then submitted on chain by Dinari. Once the transfer is submitted on chain, the corresponding `Withdrawal` is created.\n\nCurrently, withdrawals are made in USDC on the Arbitrum network (Chain ID `eip155:42161`).\n"
    },
    {
      "name": "Dinari API Enterprise V2",
      "description": ""
    }
  ],
  "openapi": "3.1.0"
}