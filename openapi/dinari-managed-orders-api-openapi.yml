        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRequest'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLimitOrderBuyRequestInput'
      tags:
      - Managed Orders
      summary: Create Limit Buy Managed Order Request
      description: '

        Create a managed `OrderRequest` to place a limit buy `Order`.


        Fees for the `Order` can optionally be specified in the `OrderRequest` for DFN orders in USD, supporting up to 6 decimal places


        If an `OrderRequest` with the same `client_order_id` already exists for the given account, the creation call will fail.

        '
      operationId: createLimitBuyManagedOrderRequest
      security:
      - ApiKeyId: []
        ApiSecretKey: []
  /api/v2/accounts/{account_id}/order_requests/limit_sell:
    parameters:
    - in: path
      name: account_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseOpenApiError'
        '201':
          description: Created
          content:
            application/json:
              schema:
