openapi: 3.1.0
info:
  description: '**Dinari API for enterprise usage.**


    Dinari''s dShares let businesses offer tokenized access to stocks to their customers through an easy-to-use API.

    Integrate Dinari''s API and offer over a hundred stocks and ETFs to your customers.

    '
  contact:
    email: hello@dinari.com
  license:
    name: Contact us
  termsOfService: https://dinari.com/terms
  title: Dinari Enterprise Accounts Managed Orders API
  version: v20260709-097f56a
servers:
- url: https://api-enterprise.sbt.dinari.com
tags:
- name: Managed Orders
  description: '**Managed `Orders` represent the buying and selling of assets using a Dinari-managed `Wallet`.**


    Similar to Proxied `Orders`, placing a managed `Order` creates an `OrderRequest` which is then submitted on chain by Dinari. Once the request is submitted on chain, the corresponding `Order` is created.

    Unlike Proxied `Orders`, managed `Orders` are available only for `Accounts` using Dinari-managed `Wallets`.


    Note that **fees are not included** in the `Order` amount. For buy orders, a fee will be added when placing the order. For sell orders, the fee will be deducted from the proceeds of the sale.

    Call the *Get Order Request Fee Quote* route for an estimate of the fee amount.

    '
paths:
  /api/v2/accounts/{account_id}/order_requests/market_buy:
    parameters:
    - in: path
      name: account_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseOpenApiError'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRequest'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMarketBuyOrderRequestInput'
      tags:
      - Managed Orders
      summary: Create Market Buy Managed Order Request
      description: '

        Create a managed `OrderRequest` to place a market buy `Order`.


        Fees for the `Order` can optionally be specified in the `OrderRequest` for DFN orders in USD, supporting up to 6 decimal places


        If an `OrderRequest` with the same `client_order_id` already exists for the given account, the creation call will fail.

        '
      operationId: createMarketBuyManagedOrderRequest
      security:
      - ApiKeyId: []
        ApiSecretKey: []
  /api/v2/accounts/{account_id}/order_requests/market_sell:
    parameters:
    - in: path
      name: account_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      responses:
        '422':
          $ref: '#/components/responses/UNPROCESSABLE_ENTITY'
        '423':
          description: Locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseOpenApiError'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRequest'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMarketSellOrderRequestInput'
      tags:
      - Managed Orders
      summary: Create Market Sell Managed Order Request
      description: '

        Create a managed `OrderRequest` to place a market sell `Order`.


        Fees for the `Order` can optionally be specified in the `OrderRequest` for DFN orders in USD, supporting up to 6 decimal places


        If an `OrderRequest` with the same `client_order_id` already exists for the given account, the creation call will fail.

        '
      operationId: createMarketSellManagedOrderRequest
      security:
      - ApiKeyId: []
        ApiSecretKey: []
  /api/v2/accounts/{account_id}/order_requests/limit_buy:
    parameters:
    - in: path
      name: account_id
      required: true
      schema:
        type: string
        format: uuid
    post:
