- aid: dinari:dinari-wallets-api
  name: Dinari Wallets API
  description: >-
    **`Wallets` represent the blockchain wallet that holds the assets of an `Account`.**


    An `Account` may be connected to a single `Wallet`.


    Individual `Entities` can connect their self-custodied `Wallets` by proving ownership of the `Wallet`
    address.

    For Dinari Partners, a Dinari-managed `Wallet` can be created for the Partner `Entity` in the [Dinari
    Partners Portal](https://Partners.dinari.com/). This may be used in omnibus accounting for self-managing
    customers' assets.
  humanURL: https://docs.dinari.com
  baseURL: https://api-enterprise.sbt.dinari.com/api/v2
