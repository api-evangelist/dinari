- aid: dinari:dinari-managed-orders-api
  name: Dinari Managed Orders API
  description: >-
    **Managed `Orders` represent the buying and selling of assets using a Dinari-managed `Wallet`.**


    Similar to Proxied `Orders`, placing a managed `Order` creates an `OrderRequest` which is then submitted
    on chain by Dinari. Once the request is submitted on chain, the corresponding `Order` is created.

    Unlike Proxied `Orders`, managed `Orders` are available only for `Accounts` using Dinari-managed `Wallets`.


    Note that **fees are not included** in the `Order` amount. For buy orders, a fee will be added when
    placing the order. For sell orders, the fee will be deducted from the proceeds of the sale.

    Call the *Get Order Request Fee Quote* route for an estimate of the fee amount.
  humanURL: https://docs.dinari.com
  baseURL: https://api-enterprise.sbt.dinari.com/api/v2
  tags:
  - Managed Orders
