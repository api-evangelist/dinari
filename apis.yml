- aid: dinari:dinari-orders-api
  name: Dinari Orders API
  description: >-
    **`Orders` represent the buying and selling of assets under an `Account`.**


    For `Accounts` using self-custodied `Wallets`, `Orders` are created and fulfilled by making calls
    to Dinari's smart contracts, or using the *Proxied Orders* methods.


    For `Accounts` using managed `Wallets`, `Orders` are created and fulfilled by using the `Managed Orders`
    methods, which then create the corresponding transactions on the blockchain.
  humanURL: https://docs.dinari.com
  baseURL: https://api-enterprise.sbt.dinari.com/api/v2
