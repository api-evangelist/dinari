- aid: dinari:dinari-kyc-api
  name: Dinari KYC API
  description: >-
    **KYC (Know Your Customer) is a process of verifying the identity of customer `Entities`.**


    KYC is required for all customer `Entities` that transact on Dinari's platform.


    Dinari provides a managed KYC process for its Partners, which provides a convenient KYC flow URL to
    present to the end customer.


    For Dinari Partners that supply their own KYC data, the API provides a way to record a customer's
    KYC information using the Partner's KYC data. This requires an existing KYC agreement between Dinari
    and the Partner.
