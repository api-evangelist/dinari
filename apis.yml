- aid: dinari:dinari-withdrawals-api
  name: Dinari Withdrawals API
  description: >-
    **`Withdrawals` represent the transfer of stablecoins from an `Account` connected to a managed `Wallet`
    to another `Account` that is owned by the `Entity`.**


    Since the `Account` is backed by a managed `Wallet`, the `Withdrawal` must be processed by Dinari
    and the corresponding transaction is submitted on chain.


    Upon requesting a withdrawal, a `WithdrawalRequest` is created, which is then submitted on chain by
    Dinari. Once the transfer is submitted on chain, the corresponding `Withdrawal` is created.


    Currently, withdrawals are made in USDC on the Arbitrum network (Chain ID `eip155:42161`).
  humanURL: https://docs.dinari.com
  baseURL: https://api-enterprise.sbt.dinari.com/api/v2
  tags:
  - Withdrawals
