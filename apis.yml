aid: dinari
name: Dinari
description: >-
  Dinari provides tokenized US stocks and ETFs (dShares) backed 1:1 by real securities,
  giving businesses an API to offer global customers regulated access to over a hundred
  equities and index tokens across 85+ jurisdictions. The Dinari Enterprise API covers
  entity onboarding and KYC/KYB, brokerage account management, market data (prices,
  quotes, splits, dividends, news), managed and on-chain (EIP-155 permit) order requests,
  order fulfillment, blockchain wallet connection, token transfers, withdrawals, and a
  USD+ stablecoin for dividend payments. dShares settle on-chain across Arbitrum One,
  HyperEVM, and Avalanche C-Chain. Surfaced as a portfolio company of 500 Global and
  Version One Ventures and enriched into the API Evangelist network.
